[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "a4i2026-challenge4-evacuation"
version = "0.2.0"
description = "Challenge 4: Adaptive Evacuation Readiness & Vulnerable Community Planning Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=2.12,<3",
    "google-genai>=2.30,<3",
    "google-cloud-bigquery>=3.25,<4",
    "mcp>=1.24,<3",
    "ortools>=9.12,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "sqlglot>=25"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
