# MCP Toolbox for Databases: read-only registry lookups for the readiness agent.
# Format: Toolbox v1 multi-document config (kind: source / tool / toolset).
#
# The agent consumes these over MCP at <TOOLBOX_URL>/mcp/evacuation_readiness, prefixed "toolbox_".
# The judgment (ranking, verification, the brief) lives in the agent's Python tools; these are the
# generic "show me the rows" tools that belong behind a managed MCP server.
#
# Every tool reads the readiness_ops views (sql/*.sql), never the raw source tables, so a chat
# answer over MCP applies the same rules as the brief: trimmed usage codes, unrecorded capacity,
# implausible capacity, and FEMA names that say INACTIVE. Rebuild the views with
# scripts/build_views.sh before deploying.
#
# Local:      toolbox --config toolbox/tools.yaml
# Cloud Run:  bash scripts/deploy_toolbox.sh   (min instances 1, private, BigQuery read-only)
#
# The dataset names are literal below. If you load into different datasets, change them here too.

kind: source
name: evacuation-bq
type: bigquery
project: ${GOOGLE_CLOUD_PROJECT}
location: US
writeMode: blocked
allowedDatasets:
  - evacuation_readiness
  - readiness_ops
---
kind: tool
name: shelter_records_by_county
type: bigquery-sql
source: evacuation-bq
description: >
  FEMA shelter registry rows for one county, with wheelchair, generator, surge and floodplain
  flags as YES, NO or UNRECORDED. UNRECORDED means nobody wrote it down; it is never "no".
  capacity is NULL when it was never recorded. name_says_inactive is TRUE when FEMA's own name
  reads INACTIVE, CLOSED, DEMOLISHED or DO NOT USE; never recommend those as destinations.
  Historical registry: it does not say whether a building is open today.
parameters:
  - name: county_fips
    type: string
    description: 5-digit county FIPS code, e.g. 12071 for Lee County, Florida.
statement: |
  SELECT
    shelter_id, shelter_name, address_1, city, zip,
    usage_status, pre_landfall_status,
    capacity, capacity_status, capacity_implausible,
    wheelchair_status, generator_status, surge_status, floodplain_status,
    is_medical, name_says_inactive
  FROM `readiness_ops.v_shelter_evidence`
  WHERE county_fips = @county_fips
  ORDER BY shelter_name
---
kind: tool
name: county_record_quality
type: bigquery-sql
source: evacuation-bq
description: >
  For one county, how many pre-landfall (EVAC or BOTH) shelters have each flag recorded as YES,
  NO, or left blank. Use it to say "N I can speak to; M nobody has assessed." Capacity counts
  and totals match the readiness brief: they exclude shelters whose FEMA name says inactive
  (reported separately) and implausible capacities.
parameters:
  - name: county_fips
    type: string
    description: 5-digit county FIPS code.
statement: |
  SELECT
    COUNT(*) AS pre_landfall_shelters,
    COUNTIF(capacity_status = 'RECORDED' AND NOT capacity_implausible AND NOT name_says_inactive)
      AS capacity_recorded,
    COUNTIF(capacity_status = 'UNRECORDED' AND NOT name_says_inactive) AS capacity_unrecorded,
    IFNULL(SUM(IF(capacity_status = 'RECORDED' AND NOT capacity_implausible AND NOT name_says_inactive,
                  capacity, 0)), 0) AS recorded_capacity_total,
    COUNTIF(capacity_implausible) AS capacity_implausible,
    COUNTIF(name_says_inactive) AS name_says_inactive,
    IFNULL(SUM(IF(name_says_inactive AND capacity_status = 'RECORDED', capacity, 0)), 0)
      AS name_says_inactive_spaces,
    COUNTIF(wheelchair_status = 'YES') AS wheelchair_yes,
    COUNTIF(wheelchair_status = 'NO') AS wheelchair_no,
    COUNTIF(wheelchair_status = 'UNRECORDED') AS wheelchair_unrecorded,
    COUNTIF(generator_status = 'YES') AS generator_yes,
    COUNTIF(generator_status = 'NO') AS generator_no,
    COUNTIF(generator_status = 'UNRECORDED') AS generator_unrecorded,
    COUNTIF(surge_status = 'YES') AS surge_yes,
    COUNTIF(surge_status = 'NO') AS surge_no,
    COUNTIF(surge_status = 'UNRECORDED') AS surge_unrecorded
  FROM `readiness_ops.v_shelter_evidence`
  WHERE county_fips = @county_fips AND is_pre_landfall
---
kind: tool
name: tract_record
type: bigquery-sql
source: evacuation-bq
description: >
  One populated census tract's row: population, households without a vehicle (ACS vehicle
  ownership, not access to a ride), estimated people in them, age 65+ and disability (CDC SVI),
  mobile homes, modeled mobility disability (CDC PLACES), and hurricane and coastal-flood exposed
  population (FEMA NRI). Tracts with no residents return no row.
parameters:
  - name: geo_id
    type: string
    description: 11-digit census tract id (2020 boundaries).
statement: |
  SELECT
    geo_id, county_fips, total_pop, households, households_no_vehicle,
    share_no_vehicle, est_persons_no_vehicle,
    pop_65_plus, pct_age_65_plus, pct_disability, pct_mobile_homes, mobile_homes,
    pct_mobility AS pct_mobility_modeled,
    hurricane_exposed_pop, coastal_flood_exposed_pop
  FROM `readiness_ops.v_tract_need`
  WHERE geo_id = @geo_id
---
kind: toolset
name: evacuation_readiness
tools:
  - shelter_records_by_county
  - county_record_quality
  - tract_record
